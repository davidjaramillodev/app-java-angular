server:
  port: 8081

spring:
  application:
    name: loan-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loans}
    username: ${SPRING_DATASOURCE_USERNAME:loan_user}
    password: ${SPRING_DATASOURCE_PASSWORD:loan-dev-only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-this-32-bytes-minimum}
    jwt-issuer: app-java-angular-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true